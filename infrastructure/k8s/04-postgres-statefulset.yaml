apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: iicpc
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: timescale/timescaledb:latest-pg15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: iicpc_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: iicpc-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: iicpc_metrics
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      volumeClaimTemplates:
      - metadata:
          name: postgres-data
        spec:
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 10Gi
