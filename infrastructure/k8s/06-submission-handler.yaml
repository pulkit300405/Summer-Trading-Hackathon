apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-handler
  namespace: iicpc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submission-handler
  template:
    metadata:
      labels:
        app: submission-handler
    spec:
      containers:
      - name: submission-handler
        image: pulkit300405/summer-trading-hackathon-submission-handler:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: submission-handler
  namespace: iicpc
spec:
  type: ClusterIP
  selector:
    app: submission-handler
  ports:
  - port: 8080
    targetPort: 8080
